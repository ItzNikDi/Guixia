palette = "catppuccin_mocha_mod"

## a slightly modified version of catppuccin mocha
[palettes.catppuccin_mocha_mod]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
cyclamen = "#c65b7a"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
system = "#43f7c4"
additional = "#ccdb42"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
guix = "#ffcc00"

format = """
$os$username$hostname$directory$guix_shell$direnv$git_branch$git_state$git_status$git_metrics$cmd_duration$sudo$character
"""

[os]
style = "guix"
disabled = false

[os.symbols]
Hurd = " "
Linux = " "
Unknown = " "

[username]
style_root = "maroon"
style_user = "maroon"
format = "[$user]($style)@"
show_always = true

[hostname]
ssh_only = false
ssh_symbol = " 󰢹"
style = "bold system"

[directory]
truncation_length = 0
truncate_to_repo = true
style = "bold peach"
read_only = "󰣮 "
truncation_symbol = "repo: "

[guix_shell]
symbol = "󱢆 "

[direnv]
format = 'with [\[$symbol $loaded/$allowed\]]($style) '
symbol = ""
style = "bold teal"
disabled = false
allowed_msg = "󱥾 "
not_allowed_msg = "󰉘 "
denied_msg = " "
loaded_msg = " "
unloaded_msg = "󱧊 "

[git_branch]
symbol = "󰘬 "
style = "bold green"

[git_state]
style = "bold peach"
format = "[($state($progress_current/$progress_total))]($style) "

[git_status]
ahead = "${count}"
behind = "${count}"
diverged = "${ahead_count}${behind_count}"
deleted = "${count}"
style = "text"

[git_metrics]
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "
disabled = false

[cmd_duration]
show_milliseconds = true
format = "took [$duration]($style) "
style = "bold additional"
show_notifications = true
min_time_to_notify = 30_000

[sudo]
symbol = "󰒒 "
disabled = false

[character]
success_symbol = "[●](green)"
error_symbol = "[✖](red)"

