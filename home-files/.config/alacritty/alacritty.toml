[general]
import = [ "./themes/catppuccin-mocha.toml" ]

[font]
normal = { family = "Hasklug Nerd Font", style = "Medium" }
size = 14.5

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors]
selection = { text = "CellBackground", background = "CellForeground" }

[window]
startup_mode = "Windowed"
padding = { x = 8, y = 8 }
opacity = 0.75

[selection]
save_to_clipboard = true
